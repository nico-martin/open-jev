<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>open-jev simple example</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <h1>open-jev</h1>
      <p>
        One state, three typed questions, one forward pass. Everything runs in
        your browser.
      </p>

      <section>
        <button id="info">Info</button>
        <button id="init">Load</button>
        <button id="decide" disabled>Decide</button>
        <p id="status">Status: idle</p>
        <p id="model">Model: unknown</p>
        <progress id="progress" max="1" value="0"></progress>
      </section>

      <section>
        <h2>State</h2>
        <textarea id="state" rows="4">
I was charged twice for the same order and nobody answers my emails. I want my money back now.</textarea
        >
      </section>

      <section>
        <h2>Answers</h2>
        <div id="answers"><p>No decision yet.</p></div>
      </section>

      <section>
        <h2>Event log</h2>
        <pre id="log"></pre>
      </section>
    </main>
  </body>
</html>
